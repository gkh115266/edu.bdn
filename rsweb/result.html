<script>
function viewResult() {

    let roll = document.getElementById("roll_no").value.trim();
    let classId = document.getElementById("class_id").value;
    let examId = document.getElementById("exam_id").value;
    let sessionId = document.getElementById("session_id").value;

    if (classId != "9") {
        alert("Only Class 10 Result Available!");
        return;
    }

    if (examId != "2") {
        alert("Only Pre-Test Result Available!");
        return;
    }

    if (sessionId != "4") {
        alert("Only Session 2026 Available!");
        return;
    }

    window.location.href = "results/" + roll + ".html";
}
</script>
